<!DOCTYPE html>
<html>
<head>
  <!--
    Flutter's web build used to ship a service worker that could keep
    serving an older cached version of the app even after a normal reload -
    remove any such leftover on every load so updates always take effect.
    push_sw.js (push notifications only, no caching) is kept.
  -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        for (var i = 0; i < regs.length; i++) {
          var worker = regs[i].active || regs[i].waiting || regs[i].installing;
          if (worker && worker.scriptURL.indexOf('push_sw.js') !== -1) continue;
          regs[i].unregister();
        }
      });
    }
    if (window.caches && caches.keys) {
      caches.keys().then(function (names) {
        for (var i = 0; i < names.length; i++) caches.delete(names[i]);
      });
    }
  </script>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!--
    Android Chrome (108+) no longer shrinks the page when the on-screen
    keyboard opens, it just draws the keyboard over it, so Flutter never lifts
    the focused text field above it. interactive-widget=resizes-content
    restores the resizing. Flutter replaces the viewport tag with its own at
    startup, so re-apply it to whichever viewport tag ends up in the head.
  -->
  <script>
    (function () {
      function patch() {
        var metas = document.querySelectorAll('meta[name="viewport"]');
        for (var i = 0; i < metas.length; i++) {
          var content = metas[i].getAttribute('content') || '';
          if (content.indexOf('interactive-widget') === -1) {
            metas[i].setAttribute('content', content + ', interactive-widget=resizes-content');
          }
        }
      }
      patch();
      new MutationObserver(patch).observe(document.head, {
        childList: true,
        subtree: true,
        attributes: true,
        attributeFilter: ['content'],
      });
    })();
  </script>
  <meta name="description" content="SAMEPACE - gemeinsam Sport machen, wenn es zeitlich passt.">
  <meta name="theme-color" content="#F8F6F1">
  <!--
    Start downloading the app code right away, while the version check
    below is still running (it used to wait up to 1.5 s before even
    starting the download).
  -->
  <link rel="preload" href="main.dart.js?v=20261001105208-3b95365" as="script">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SAMEPACE">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SAMEPACE</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; background: #F8F6F1; }
    /* Shown instantly while the app loads, instead of a blank page. */
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: #F8F6F1; color: #1B4332;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity .25s ease;
    }
    #splash .name { font-size: 26px; font-weight: 800; letter-spacing: .5px; }
    #splash .bar {
      width: 120px; height: 4px; border-radius: 2px; overflow: hidden;
      background: #D8F3DC;
    }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%;
      border-radius: 2px; background: #40916C;
      animation: splash-slide 1.1s ease-in-out infinite;
    }
    @keyframes splash-slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }
    #splash.gone { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="splash" aria-label="SAMEPACE lädt">
    <svg width="64" height="64" viewBox="0 0 24 24" aria-hidden="true">
      <path fill="#1B4332" d="M14 6l-3.75 5 2.85 3.8-1.6 1.2C9.81 13.75 7 10 7 10l-6 8h22L14 6z"/>
    </svg>
    <div class="name">SAMEPACE</div>
    <div class="bar"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('splash');
      if (!el) return;
      el.classList.add('gone');
      setTimeout(function () { el.remove(); }, 300);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!--
    Home-screen web apps (especially on iPhone) are only woken up, not
    reloaded, and keep serving files from their cache - so new versions
    never showed up. tool/stamp_build.py stamps every deploy with an id;
    this compares it with the live build.json on start and whenever the
    app comes back after a while, and reloads into the new version.
  -->
  <script>
    window.samepaceBuild = '20261001105208-3b95365';
    (function () {
      var hiddenAt = 0;
      var started = false;

      // Returns a promise of the newer build id, or null (same version,
      // unknown, offline, or it took too long - never block the start).
      function newerBuild(timeoutMs) {
        if (window.samepaceBuild.indexOf('BUILD_ID') !== -1) {
          return Promise.resolve(null);
        }
        var check = fetch('build.json?t=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (d) {
            return d && d.id && d.id !== window.samepaceBuild ? d.id : null;
          })
          .catch(function () { return null; });
        var timeout = new Promise(function (resolve) {
          setTimeout(function () { resolve(null); }, timeoutMs);
        });
        return Promise.race([check, timeout]);
      }

      function reloadInto(id) {
        // Only one try per version, so a stale CDN can't cause a loop.
        try {
          if (sessionStorage.getItem('samepace-reload') === id) return false;
          sessionStorage.setItem('samepace-reload', id);
        } catch (_) {}
        location.replace(location.pathname + '?v=' + id + location.hash);
        return true;
      }

      function startApp() {
        if (started) return;
        started = true;
        var s = document.createElement('script');
        s.src = 'flutter_bootstrap.js?v=' + window.samepaceBuild;
        s.async = true;
        document.body.appendChild(s);
      }

      // Check first, then start: an outdated copy jumps straight to the new
      // version instead of starting twice.
      document.addEventListener('DOMContentLoaded', function () {
        newerBuild(1500).then(function (id) {
          if (!(id && reloadInto(id))) startApp();
        });
      });

      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden') {
          hiddenAt = Date.now();
        } else if (hiddenAt && Date.now() - hiddenAt > 30000) {
          newerBuild(5000).then(function (id) { if (id) reloadInto(id); });
        }
      });
    })();
  </script>
  <script src="push_helper.js?v=20261001105208-3b95365"></script>
</body>
</html>
